server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: catalog-service
              uri: http://catalog-service:8081
              predicates:
                - Path=/cakes/**

            - id: order-service
              uri: http://order-service:8082
              predicates:
                - Path=/orders/**

            - id: rating-service
              uri: http://rating-service:8083
              predicates:
                - Path=/ratings/**

            - id: notification-service
              uri: http://notification-service:8084
              predicates:
                - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted