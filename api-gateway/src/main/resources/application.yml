server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/cakes/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

            - id: rating-service
              uri: http://localhost:8083
              predicates:
                - Path=/ratings/**

            - id: notification-service
              uri: http://localhost:8084
              predicates:
                - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted