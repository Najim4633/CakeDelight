apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            # Your original Database URL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-db:3306/cakedelight_order?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8081"
            # Injected Database Credentials
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cakedelight-secrets
                  key: mysql-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cakedelight-secrets
                  key: mysql-password

            # Your original RabbitMQ properties
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP
              value: "true"

            # Injected RabbitMQ Credentials
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cakedelight-secrets
                  key: rabbitmq-user
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cakedelight-secrets
                  key: rabbitmq-password
